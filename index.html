  <style>
    :root{
      /* Palette officielle Charentes Tourisme (Guide de marque, mars 2024) */
      --bleu:#140F40;
      --violet:#B7BCE3;
      --violet-fonce:#4A4B85;
      --orange:#F7AC6F;
      --orange-fonce:#C97536;
      --vert:#C4E7DF;
      --vert-fonce:#5FA491;
      --rose:#FADCEB;
      --jaune:#F1EA75;
      --gris:#F5F4F4;
      --creme:#fff8ef;
      --fond:#F5F4F4;
      --blanc:#ffffff;
      --texte:#140F40;
      --muted:#5b5a78;
      --ligne:#E4E1EE;
      --ok-bg:#E7F5F0;
      --ok-border:#5FA491;
      --shadow:0 10px 28px rgba(20,15,64,.08);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--fond);
      color:var(--texte);
      font-family:Montserrat, Arial, Helvetica, sans-serif;
    }

    button{
      font:inherit;
      cursor:pointer;
    }

    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .app{
      width:min(1180px, 94vw);
      margin:0 auto;
      padding:24px 0 48px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .left-actions,
    .right-actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:8px 12px;
      border-radius:999px;
      background:#efe9e3;
      font-size:.83rem;
      font-weight:800;
    }

    .display{
      font-family:Montserrat, Arial, Helvetica, sans-serif;
      font-weight:800;
      font-style:italic;
      letter-spacing:-.025em;
    }

    .panel{
      background:var(--blanc);
      border:1px solid var(--ligne);
      border-radius:24px;
      padding:clamp(18px, 3vw, 34px);
      box-shadow:var(--shadow);
    }

    .stack{
      display:grid;
      gap:16px;
    }

    .grid-3{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:14px;
    }

    .grid-2{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:14px;
    }

    .primary,
    .secondary,
    .back{
      min-height:48px;
      border-radius:14px;
      padding:11px 16px;
      font-weight:900;
      border:0;
    }

    .primary{
      background:var(--bleu);
      color:white;
    }

    .secondary,
    .back{
      background:white;
      color:var(--texte);
      border:1px solid var(--ligne);
    }

    .wide{width:100%}

    .intro-title{
      font-size:clamp(2rem, 5vw, 4.3rem);
      line-height:1.02;
      margin:12px 0 8px;
    }

    .intro-subtitle{
      font-size:clamp(1rem, 2vw, 1.3rem);
      max-width:800px;
      margin:0;
      color:#4e4945;
    }

    .step-card{
      border-radius:18px;
      padding:18px;
      background:#f3eeea;
      min-height:auto;
      text-align:center;
    }

    .step-card strong{
      display:block;
      font-size:1.05rem;
    }

    .logo-stage{
      min-height:170px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:6px;
    }

    .label-logo{
      display:block;
      width:auto;
      height:auto;
      max-width:min(360px, 85%);
      max-height:155px;
      object-fit:contain;
    }

    .round-logo{
      display:block;
      margin:0 auto 18px;
      width:auto;
      height:auto;
      max-width:260px;
      max-height:120px;
      object-fit:contain;
    }

    .logo-fallback{
      display:none;
      font-size:clamp(1.8rem, 4vw, 3rem);
      font-weight:900;
      font-style:italic;
    }

    .move-zone{
      min-height:180px;
      border:2px solid var(--ligne);
      border-radius:22px;
      background:white;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      padding:20px;
    }

    .move-icon{
      width:60px;
      height:60px;
      border-radius:18px;
      display:grid;
      place-items:center;
      margin-bottom:12px;
      background:#f3eeea;
      font-size:1.7rem;
      font-weight:900;
    }

    .move-zone h3{
      margin:0;
      font-size:1.35rem;
    }

    .score-row{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .score-card{
      border-radius:16px;
      padding:10px 12px;
      background:#f2ede8;
      text-align:center;
    }

    .score-line{
      height:6px;
      border-radius:999px;
      margin-bottom:8px;
    }

    .score-card .name{
      font-size:.82rem;
      font-weight:800;
    }

    .score-card .score{
      font-size:1.55rem;
      font-weight:900;
      margin-top:2px;
    }

    .progress{
      height:8px;
      border-radius:999px;
      background:#e9e3de;
      overflow:hidden;
    }

    .question-nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .progress > div{
      height:100%;
      background:linear-gradient(90deg,var(--violet-fonce),var(--orange-fonce));
      transition:width .25s ease;
    }

    .question-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .timer-wrap{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .timer{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:900;
      font-size:1.4rem;
      min-width:72px;
    }

    .timer-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--orange-fonce);
      animation:blink 1s infinite;
    }

    .timer.done .timer-dot{
      animation:none;
      background:#9c948d;
    }

    .question-title{
      font-size:clamp(1.55rem, 3vw, 2.55rem);
      line-height:1.12;
      margin:0 0 20px;
    }

    .options{
      display:grid;
      gap:10px;
    }

    .option{
      border:2px solid var(--ligne);
      border-radius:16px;
      padding:14px 16px;
      background:white;
      font-weight:800;
      display:flex;
      align-items:flex-start;
      gap:10px;
      transition:.18s ease;
    }

    .option .letter{
      flex:0 0 auto;
      width:34px;
      height:34px;
      border-radius:10px;
      display:grid;
      place-items:center;
      background:#f3eeea;
      font-weight:900;
    }

    .option.correct{
      border-color:var(--ok-border);
      background:var(--ok-bg);
      transform:scale(1.008);
    }

    .option.dim{
      opacity:.5;
    }

    .answer-box{
      margin-top:18px;
      border-left:5px solid var(--vert-fonce);
      background:var(--ok-bg);
      border-radius:14px;
      padding:15px 17px;
    }

    .answer-box strong{
      display:block;
      margin-bottom:4px;
    }

    .team-panel h3{
      margin-top:0;
      font-size:1rem;
    }

    .team-choices{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:12px;
    }

    .team-block{
      min-width:0;
    }

    .team-name{
      font-weight:900;
      font-size:.9rem;
      margin-bottom:8px;
    }

    .team-buttons{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .team-buttons button{
      min-width:48px;
      min-height:48px;
      border-radius:12px;
      border:2px solid var(--ligne);
      background:white;
      font-weight:900;
    }

    .team-buttons button.selected{
      background:var(--texte);
      color:white;
      border-color:var(--texte);
    }

    .footer-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .footer-actions > *{
      flex:1 1 220px;
    }

    .exchange-card{
      border-radius:18px;
      padding:20px;
      background:#f3eeea;
      min-height:140px;
    }

    .exchange-card strong{
      display:block;
      margin-bottom:8px;
    }

    .final-logos{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    .final-card{
      text-align:center;
    }

    .final-card img{
      height:78px;
      max-width:160px;
      width:auto;
      object-fit:contain;
      margin-bottom:12px;
    }

    .sound-status{
      min-width:118px;
    }

    .ct-brand-logo{
      display:block;
      height:44px;
      width:auto;
    }

    .ct-intro-logo{
      display:block;
      height:56px;
      width:auto;
      margin-bottom:18px;
    }

    .ct-footer{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:6px 0 0;
      color:var(--muted);
      font-size:.8rem;
      font-weight:700;
    }

    .ct-footer img{
      height:22px;
      width:auto;
    }

    .hidden{display:none!important}

    @keyframes blink{
      0%,100%{opacity:1}
      50%{opacity:.25}
    }

    @media (max-width:800px){
      .grid-3,.grid-2,.score-row,.team-choices,.final-logos{
        grid-template-columns:1fr;
      }
      .app{
        width:min(96vw, 760px);
      }
      .move-zone{
        min-height:130px;
      }
      .team-buttons button{
        flex:1;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
    }
  </style>
</head>

                'Renforcer à la fois la qualité de l’accueil et l’écoresponsabilité',
                'Évaluer uniquement l’esthétique du lieu',
                'Récompenser seulement les sites les plus fréquentés'
              ],
              a:0,
              x:'Destination d’Excellence associe qualité de l’accueil et des services et écoresponsabilité.'
            },
            {
              cat:'Quels bénéfices ?',
              q:'Pour un lieu de visite, l’intérêt de la démarche est surtout de…',
              o:[
                'Structurer une amélioration continue et faire reconnaître la qualité globale du site',
                'Obtenir uniquement un nouveau logo de communication',
                'Éviter toute autre démarche qualité'
              ],
              a:0,
              x:'Le label aide à structurer les pratiques, identifier les points d’amélioration et valoriser un niveau d’exigence reconnu.'
            },
            {
              cat:'Éligibilité & critères',
              q:'Sur quels deux piliers repose l’évaluation Destination d’Excellence ?',
              o:[
                'Accueil & services + écoresponsabilité',
                'Prix + fréquentation',
                'Accessibilité + accueil vélo'
              ],
              a:0,
              x:'L’évaluation porte sur la qualité de l’accueil et des services ainsi que sur l’écoresponsabilité.'
            },
            {
              cat:'Évaluation',
              q:'Quelle forme prend notamment l’évaluation d’un lieu de visite ?',
              o:[
                'Une visite mystère réalisée par un organisme évaluateur habilité',
                'Une auto-déclaration sans contrôle extérieur',
                'Un vote annuel sur les réseaux sociaux'
              ],
              a:0,
              x:'Un organisme évaluateur habilité réalise notamment une visite mystère.'
            },
            {
              cat:'Coût & investissement',
              q:'Existe-t-il un tarif national unique pour l’audit Destination d’Excellence ?',
              o:[
                'Oui, exactement 200 € partout en France',
                'Non, le coût varie selon l’organisme évaluateur et l’accompagnement',
                'Oui, uniquement pour les lieux de visite'
              ],
              a:1,
              x:'Il n’existe pas de tarif national unique : le coût dépend notamment de l’organisme évaluateur et des modalités d’accompagnement.'
            },
            {
              cat:'Visibilité & durée',
              q:'Quelle est la durée maximale habituelle de validité de Destination d’Excellence ?',
              o:[
                '2 ans',
                '3 ans',
                '5 ans'
              ],
              a:2,
              x:'Le label peut être attribué pour une durée allant jusqu’à 5 ans.'
            }
          ]
        }
      ];

      let screen = 'intro';
      let movementIndex = 0;
      let roundIndex = 0;
      let questionIndex = 0;
      let revealed = false;
      let teamChoices = [null, null, null];
      let seconds = 20;
      let timer = null;
      let paused = false;
      let soundOn = true;
      let history = [];
      let audioCtx = null;

      const totalQuestions = rounds.reduce((sum, r) => sum + r.questions.length, 0);

      function snapshot(){
        return {
          screen,
          movementIndex,
          roundIndex,
          questionIndex,
          revealed,
          teamChoices:[...teamChoices],
          seconds,
          paused,
          soundOn,
          scores:teams.map(t => t.score)
        };
      }

      function restore(state){
        screen = state.screen;
        movementIndex = state.movementIndex;
        roundIndex = state.roundIndex;
        questionIndex = state.questionIndex;
        revealed = state.revealed;
        teamChoices = [...state.teamChoices];
        seconds = state.seconds;
        paused = state.paused;
        soundOn = state.soundOn;
        teams.forEach((t,i) => t.score = state.scores[i]);
      }

      function goForward(mutator){
        history.push(snapshot());
        mutator();
        render();
      }

      function goBack(){
        if(!history.length) return;
        stopTimer();
        restore(history.pop());
        render();
      }

      function ensureAudio(){
        if(!audioCtx){
          const AC = window.AudioContext || window.webkitAudioContext;
          if(AC) audioCtx = new AC();
        }
        if(audioCtx && audioCtx.state === 'suspended'){
          audioCtx.resume().catch(()=>{});
        }
      }

      function tone(freq, start, duration, gainValue=.08){
        if(!audioCtx || !soundOn) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(gainValue, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(start);
        osc.stop(start + duration + 0.03);
      }

      function playChronoEnd(){
        if(!soundOn) return;
        ensureAudio();
        if(!audioCtx) return;

        const now = audioCtx.currentTime + 0.02;
        tone(880, now,       0.12, .09);
        tone(880, now+0.18,  0.12, .09);
      }

      function stopTimer(){
        if(timer){
          clearInterval(timer);
          timer = null;
        }
      }

      function startTimer(){
        if(timer || revealed || paused || seconds <= 0) return;

        timer = setInterval(() => {
          seconds = Math.max(0, seconds - 1);
          updateTimerDisplay();

          if(seconds === 0){
            stopTimer();
            playChronoEnd();
            live.textContent = 'Temps écoulé';
          }
        }, 1000);
      }

      function updateTimerDisplay(){
        const el = document.getElementById('timerValue');
        if(el) el.textContent = `${seconds}s`;

        const wrap = document.getElementById('timerDisplay');
        if(wrap){
          wrap.classList.toggle('done', seconds === 0);
        }
      }

      function scoreHTML(){
        return `
          <div class="score-row">
            ${teams.map(t => `
              <div class="score-card">
                <div class="score-line" style="background:${t.color}"></div>
                <div class="name">${t.name}</div>
                <div class="score">${t.score}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function logoHTML(src, alt, cls='label-logo'){
        return `
          <img
            class="${cls}"
            src="${src}"
            alt="${alt}"
            onerror="
              this.style.display='none';
              const f=this.nextElementSibling;
              if(f)f.style.display='block';
            "
          />
          <div class="logo-fallback">${alt}</div>
        `;
      }

      function backButton(){
        return history.length
          ? `<button class="back" id="backBtn">← Retour</button>`
          : `<span></span>`;
      }

      function soundButton(){
        return `
          <button class="secondary sound-status" id="soundBtn">
            ${soundOn ? '🔊 Son' : '🔇 Muet'}
          </button>
        `;
      }

      function commonTopbar(right=''){
        return `
          <div class="topbar">
            <div class="left-actions">
              <img class="ct-brand-logo" src="${CT_LOGO_NOIR}" alt="Charentes Tourisme" />
              ${backButton()}
            </div>
            <div class="right-actions">
              ${right}
              ${soundButton()}
            </div>
          </div>
        `;
      }

      function doneCount(){
        let done = 0;
        for(let i=0;i<roundIndex;i++) done += rounds[i].questions.length;
        done += questionIndex;
        if(revealed) done += 1;
        return done;
      }

      function bindGlobal(){
        const back = document.getElementById('backBtn');
        if(back) back.addEventListener('click', goBack);

        const sound = document.getElementById('soundBtn');
        if(sound){
          sound.addEventListener('click', () => {
            soundOn = !soundOn;
            if(soundOn){
              ensureAudio();
            }
            render();
          });
        }
      }

      function renderIntro(){
        game.innerHTML = `
          <div class="stack">
            ${commonTopbar()}
            <section class="panel">
              <img class="ct-intro-logo" src="${CT_LOGO_NAVY}" alt="Charentes Tourisme" />
              <h1 class="display intro-title">Les labels : quels bénéfices pour nos sites ?</h1>
              <p class="intro-subtitle">
                Découvrir ou renforcer les fondamentaux de Tourisme & Handicap,
                Accueil Vélo et Destination d’Excellence.
              </p>
            </section>

            <section class="panel">
              <div class="grid-3">
                <div class="step-card">
                  <strong>1 · Je me positionne</strong>
                </div>
                <div class="step-card">
                  <strong>2 · Je joue</strong>
                </div>
                <div class="step-card">
                  <strong>3 · J’échange</strong>
                </div>
              </div>
            </section>

            <button class="primary wide" id="startBtn">Démarrer</button>
          </div>
        `;

        document.getElementById('startBtn').addEventListener('click', () => {
          ensureAudio();
          goForward(() => screen = 'movement');
        });

        bindGlobal();
      }

      function renderMovement(){
        const item = movements[movementIndex];

        game.innerHTML = `
          <div class="stack">
            ${commonTopbar(`<span class="pill">Brise-glace · ${movementIndex+1}/3</span>`)}

            <section class="panel" style="text-align:center">
              <div class="logo-stage">
                ${logoHTML(item.logo, item.name)}
              </div>
              <p style="font-size:1.15rem;font-weight:800;margin:0">
                Placez-vous dans la zone qui correspond à votre situation.
              </p>
            </section>

            <section class="grid-3">
              <div class="move-zone">
                <div class="move-icon" style="color:var(--vert-fonce)">✓</div>
                <h3 class="display">Déjà labellisé</h3>
              </div>

              <div class="move-zone">
                <div class="move-icon" style="color:var(--orange-fonce)">◉</div>
                <h3 class="display">Je connais</h3>
              </div>

              <div class="move-zone">
                <div class="move-icon" style="color:var(--violet-fonce)">?</div>
                <h3 class="display">Je ne connais pas</h3>
              </div>
            </section>

            <button class="primary wide" id="nextMovementBtn">
              ${movementIndex < movements.length-1 ? 'Label suivant' : 'Passer au quiz'}
            </button>
          </div>
        `;

        document.getElementById('nextMovementBtn').addEventListener('click', () => {
          goForward(() => {
            if(movementIndex < movements.length-1){
              movementIndex++;
            } else {
              screen = 'roundIntro';
            }
          });
        });

        bindGlobal();
      }

      function renderRoundIntro(){
        const round = rounds[roundIndex];

        game.innerHTML = `
          <div class="stack">
            ${commonTopbar(`<span class="pill">Manche ${roundIndex+1}/3</span>`)}

            <section class="panel" style="text-align:center">
              ${logoHTML(round.logo, round.name, 'round-logo')}
              <h2 class="display" style="font-size:clamp(2rem,4vw,3.6rem);margin:0">
                ${round.name}
              </h2>
              <p style="margin:10px 0 0;color:var(--muted);font-weight:700">
                6 questions · chrono automatique
              </p>

              <div style="margin-top:24px">
                ${scoreHTML()}
              </div>
            </section>

            <button class="primary wide" id="startRoundBtn">Démarrer la manche</button>
          </div>
        `;

        document.getElementById('startRoundBtn').addEventListener('click', () => {
          ensureAudio();
          goForward(() => {
            questionIndex = 0;
            seconds = 20;
            paused = false;
            revealed = false;
            teamChoices = [null,null,null];
            screen = 'question';
          });
        });

        bindGlobal();
      }

      function renderQuestion(){
        const round = rounds[roundIndex];
        const question = round.questions[questionIndex];
        const progress = Math.round((doneCount()/totalQuestions)*100);

        game.innerHTML = `
          <div class="stack">
            ${commonTopbar(`
              <span class="pill">${round.name}</span>
              <span class="pill">Question ${questionIndex+1}/6</span>
            `)}

            <div class="progress">
              <div style="width:${progress}%"></div>
            </div>

            <div class="question-nav">
              <button class="secondary" id="prevQBtn" ${questionIndex===0 ? 'disabled' : ''}>◀ Question précédente</button>
              <button class="secondary" id="nextQBtn">Question suivante ▶</button>
            </div>

            ${scoreHTML()}

            <section class="panel">
              <div class="question-head">
                <span class="pill">${question.cat}</span>

                <div class="timer-wrap">
                  <div class="timer ${seconds===0 ? 'done' : ''}" id="timerDisplay">
                    <span class="timer-dot"></span>
                    <span id="timerValue">${seconds}s</span>
                  </div>

                  <button class="secondary" id="pauseBtn">
                    ${paused ? 'Reprendre' : 'Pause'}
                  </button>

                  <button class="secondary" id="resetTimerBtn">↺ 20 s</button>
                </div>
              </div>

              <h2 class="display question-title">${question.q}</h2>

              <div class="options">
                ${question.o.map((answer,i) => `
                  <div class="option ${revealed ? (i===question.a ? 'correct' : 'dim') : ''}">
                    <div class="letter">${String.fromCharCode(65+i)}</div>
                    <div>${answer}</div>
                  </div>
                `).join('')}
              </div>

              ${revealed ? `
                <div class="answer-box">
                  <strong>À retenir</strong>
                  ${question.x}
                </div>
              ` : ''}
            </section>

            <section class="panel team-panel">
              <h3>Réponses des équipes</h3>

              <div class="team-choices">
                ${teams.map((team,teamIndex) => `
                  <div class="team-block">
                    <div class="team-name" style="color:${team.dark}">${team.name}</div>
                    <div class="team-buttons">
                      ${question.o.map((_,optionIndex) => `
                        <button
                          data-team="${teamIndex}"
                          data-option="${optionIndex}"
                          class="${teamChoices[teamIndex]===optionIndex ? 'selected' : ''}"
                          ${revealed ? 'disabled' : ''}
                        >
                          ${String.fromCharCode(65+optionIndex)}
                        </button>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>

            <div class="footer-actions">
              <button
                class="primary"
                id="revealBtn"
                ${revealed || teamChoices.some(v=>v===null) ? 'disabled' : ''}
              >
                ${revealed ? 'Réponse révélée' : 'Révéler la réponse'}
              </button>

              ${revealed ? `
                <button class="secondary" id="nextQuestionBtn">
                  ${questionIndex === round.questions.length-1 ? 'Temps d’échange' : 'Question suivante'}
                </button>
              ` : ''}
            </div>
          </div>
        `;

        document.querySelectorAll('[data-team]').forEach(btn => {
          btn.addEventListener('click', () => {
            teamChoices[Number(btn.dataset.team)] = Number(btn.dataset.option);
            render();
          });
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
          paused = !paused;
          if(paused) stopTimer();
          render();
        });

        document.getElementById('resetTimerBtn').addEventListener('click', () => {
          stopTimer();
          seconds = 20;
          paused = false;
          render();
        });

        const prevQBtn = document.getElementById('prevQBtn');
        if(prevQBtn){
          prevQBtn.addEventListener('click', () => {
            if(questionIndex === 0) return;
            stopTimer();
            goForward(() => {
              questionIndex--;
              seconds = 20;
              paused = false;
              revealed = false;
              teamChoices = [null,null,null];
            });
          });
        }

        const nextQBtn = document.getElementById('nextQBtn');
        if(nextQBtn){
          nextQBtn.addEventListener('click', () => {
            stopTimer();
            if(questionIndex === round.questions.length-1){
              goForward(() => {
                screen = 'exchange';
              });
            } else {
              goForward(() => {
                questionIndex++;
                seconds = 20;
                paused = false;
                revealed = false;
                teamChoices = [null,null,null];
              });
            }
          });
        }

        const revealBtn = document.getElementById('revealBtn');
        if(revealBtn){
          revealBtn.addEventListener('click', () => {
            stopTimer();

            goForward(() => {
              revealed = true;
              teams.forEach((team,i) => {
                if(teamChoices[i] === question.a) team.score++;
              });
            });
          });
        }

        const nextQuestionBtn = document.getElementById('nextQuestionBtn');
        if(nextQuestionBtn){
          nextQuestionBtn.addEventListener('click', () => {
            if(questionIndex === round.questions.length-1){
              goForward(() => {
                screen = 'exchange';
              });
            } else {
              goForward(() => {
                questionIndex++;
                seconds = 20;
                paused = false;
                revealed = false;
                teamChoices = [null,null,null];
              });
            }
          });
        }

        bindGlobal();

        if(!revealed && !paused && seconds > 0){
          startTimer();
        }
      }

      function renderExchange(){
        const round = rounds[roundIndex];

        game.innerHTML = `
          <div class="stack">
            ${commonTopbar(`<span class="pill">Fin de manche</span>`)}

            <section class="panel">
              <div style="text-align:center">
                ${logoHTML(round.logo, round.name, 'round-logo')}
                <h2 class="display" style="font-size:clamp(2rem,4vw,3.4rem);margin:0">
                  Et chez vous ?
                </h2>
                <p style="color:var(--muted);font-weight:700">
                  Temps d’échange
                </p>
              </div>

              <div class="grid-2" style="margin-top:22px">
                <div class="exchange-card">
                  <strong>Déjà engagés</strong>
                  ${round.exchange[0]}
                </div>

                <div class="exchange-card">
                  <strong>À découvrir / renforcer</strong>
                  ${round.exchange[1]}
                </div>
              </div>

              <div style="margin-top:22px">
                ${scoreHTML()}
              </div>
            </section>

            <button class="primary wide" id="continueBtn">
              ${roundIndex < rounds.length-1 ? 'Passer au label suivant' : 'Voir le résultat final'}
            </button>
          </div>
        `;

        document.getElementById('continueBtn').addEventListener('click', () => {
          goForward(() => {
            if(roundIndex < rounds.length-1){
              roundIndex++;
              questionIndex = 0;
              seconds = 20;
              paused = false;
              revealed = false;
              teamChoices = [null,null,null];
              screen = 'roundIntro';
            } else {
              screen = 'final';
            }
          });
        });

        bindGlobal();
      }

      function renderFinal(){
        const maxScore = Math.max(...teams.map(t=>t.score));
        const winners = teams
          .filter(t=>t.score===maxScore)
          .map(t=>t.name);

        game.innerHTML = `
          <div class="stack">
            ${commonTopbar(`<span class="pill">Fin du défi</span>`)}

            <section class="panel" style="text-align:center">
              <h1 class="display" style="font-size:clamp(2.2rem,5vw,4.3rem);margin:0 0 10px">
                18 fondamentaux revisités
              </h1>

              <p style="color:var(--muted);font-weight:700">
                Les points donnent du rythme ; l’objectif est surtout de repartir avec les bons repères.
              </p>

              <div style="margin-top:24px">
                ${scoreHTML()}
              </div>

              <div class="answer-box" style="text-align:left">
                <strong>${winners.join(' & ')}</strong>
                ${winners.length > 1 ? 'terminent' : 'termine'} en tête avec
                ${maxScore} point${maxScore>1 ? 's' : ''}.
              </div>
            </section>

            <section class="final-logos">
              <div class="panel final-card">
                ${logoHTML(LOGOS.th,'Tourisme & Handicap','mini-logo')}
                <strong>Accessibilité et accueil adapté</strong>
              </div>

              <div class="panel final-card">
                ${logoHTML(LOGOS.av,'Accueil Vélo','mini-logo')}
                <strong>Services adaptés aux visiteurs à vélo</strong>
              </div>

              <div class="panel final-card">
                ${logoHTML(LOGOS.de,'Destination d’Excellence','mini-logo')}
                <strong>Qualité et écoresponsabilité</strong>
              </div>
            </section>

            <button class="secondary wide" id="restartBtn">Recommencer</button>

            <div class="ct-footer">
              <span>Un jeu conçu par</span>
              <img src="${CT_LOGO_NAVY}" alt="Charentes Tourisme" />
            </div>
          </div>
        `;

        document.getElementById('restartBtn').addEventListener('click', () => {
          stopTimer();
          history = [];
          teams.forEach(t => t.score = 0);
          screen = 'intro';
          movementIndex = 0;
          roundIndex = 0;
          questionIndex = 0;
          revealed = false;
          teamChoices = [null,null,null];
          seconds = 20;
          paused = false;
          render();
        });

        bindGlobal();
      }

      function render(){
        stopTimer();

        if(screen === 'intro') renderIntro();
        else if(screen === 'movement') renderMovement();
        else if(screen === 'roundIntro') renderRoundIntro();
        else if(screen === 'question') renderQuestion();
        else if(screen === 'exchange') renderExchange();
        else if(screen === 'final') renderFinal();
      }

      render();
    })();
  </script>
</body>
</html>
